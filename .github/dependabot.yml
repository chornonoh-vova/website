version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # TODO: typescript v7.0 is lacking the JS APIs
      - dependency-name: "typescript"
        versions: ["7.0.x"]
